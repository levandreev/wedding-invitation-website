<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .petal { fill: #b8860b; }
      .center { fill: #8b6914; }
    }
    @media (prefers-color-scheme: dark) {
      .petal { fill: #d4a843; }
      .center { fill: #b8860b; }
    }
  </style>
  <!-- petals -->
  <ellipse class="petal" cx="90" cy="52" rx="18" ry="32" />
  <ellipse class="petal" cx="90" cy="128" rx="18" ry="32" />
  <ellipse class="petal" cx="52" cy="90" rx="32" ry="18" />
  <ellipse class="petal" cx="128" cy="90" rx="32" ry="18" />
  <ellipse class="petal" cx="63" cy="63" rx="18" ry="32" transform="rotate(-45 63 63)" />
  <ellipse class="petal" cx="117" cy="117" rx="18" ry="32" transform="rotate(-45 117 117)" />
  <ellipse class="petal" cx="117" cy="63" rx="18" ry="32" transform="rotate(45 117 63)" />
  <ellipse class="petal" cx="63" cy="117" rx="18" ry="32" transform="rotate(45 63 117)" />
  <!-- center -->
  <circle class="center" cx="90" cy="90" r="16" />
</svg>
